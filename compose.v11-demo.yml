# 仅v11-local.py的显式隔离模式；项目名、owner和新卷均由持久身份清单确定。
services:
  mysql:
    image: mysql:8.4
    labels: {io.flowgate.v11-demo.owner: '${FG_V11_DEMO_OWNER:?}'}
    environment:
      MYSQL_DATABASE: flowgate_v11_demo
      MYSQL_USER: flowgate
      MYSQL_PASSWORD: ${FG_MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${FG_MYSQL_ROOT_PASSWORD:?}
    ports: ['127.0.0.1:${FG_MYSQL_PORT:?}:3306']
    volumes: ['mysql-data:/var/lib/mysql']
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -Nse "SELECT 1"']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 15s
  redis:
    image: redis:7-alpine
    labels: {io.flowgate.v11-demo.owner: '${FG_V11_DEMO_OWNER:?}'}
    environment: {REDIS_PASSWORD: '${FG_REDIS_PASSWORD:?}'}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports: ['127.0.0.1:${FG_REDIS_PORT:?}:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:3.13.7-management
    hostname: v12-rabbit
    labels: {io.flowgate.v11-demo.owner: '${FG_V11_DEMO_OWNER:?}'}
    environment:
      RABBITMQ_DEFAULT_USER: ${FLOWGATE_RABBITMQ_USERNAME:?}
      RABBITMQ_DEFAULT_PASS: ${FLOWGATE_RABBITMQ_PASSWORD:?}
      RABBITMQ_DEFAULT_VHOST: /flowgate-v12
    ports: ['127.0.0.1:${FLOWGATE_RABBITMQ_PORT:?}:5672']
    volumes: ['rabbitmq-data:/var/lib/rabbitmq']
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
volumes:
  mysql-data:
    labels: {io.flowgate.v11-demo.owner: '${FG_V11_DEMO_OWNER:?}'}
  redis-data:
    labels: {io.flowgate.v11-demo.owner: '${FG_V11_DEMO_OWNER:?}'}
  rabbitmq-data:
    labels: {io.flowgate.v11-demo.owner: '${FG_V11_DEMO_OWNER:?}'}
