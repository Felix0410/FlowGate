<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>
      FlowGate · API治理平台
    </title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <a href="#main" class="skip-link">
      跳到主要内容
    </a>
    <section id="login-view" class="login-layout" aria-label="登录FlowGate">
      <div class="brand-panel">
        <a class="brand" href="./">
          <span class="logo" aria-hidden="true">
            F
          </span>
          FlowGate
        </a>
        <p class="login-context">管理接口、客户与网关配置</p>
    </div>
    <main class="login-main">
        <div class="login-card">

          <h2>
            登录 FlowGate
          </h2>
          <p class="muted">
            使用负责人配置的管理账号。会话仅在当前页面保留，刷新后需重新登录。
          </p>
          <form id="login-form">
            <label class="field" for="username">
              账号
              <input id="username" name="username" autocomplete="username" required maxlength="200">
            </label>
            <label class="field" for="password">
              密码
              <input id="password" name="password" type="password" autocomplete="current-password" required>
            </label>
            <div id="login-error" role="alert" tabindex="-1">
            </div>
            <button id="login-submit" class="primary full" type="submit">
              登录 FlowGate
            </button>
          </form>
          <div class="login-support">
            <a href="guide.html" target="_blank" rel="noopener">
              阅读使用指南
              <span class="sr-only">
                （新窗口）
              </span>
            </a>
            <button id="login-health" type="button">
              检查连接
            </button>
          </div>
          <div id="login-dependencies" aria-live="polite">
          </div>
        </div>
      </main>
    </section>
    <div id="app-view" hidden>
      <aside id="sidebar">
        <div class="sidebar-head">
          <a id="home-link" class="brand" href="#dashboard">
            <span class="logo" aria-hidden="true">
              F
            </span>
            FlowGate
          </a>
          <p class="sidebar-caption">
            API 治理平台
          </p>
        </div>
      <nav id="navigation" aria-label="业务导航"></nav>
      <div class="sidebar-bottom">
          <div class="sidebar-links">
            <a href="guide.html" target="_blank" rel="noopener">
              使用指南
              <span class="sr-only">
                （新窗口）
              </span>
            </a>
            <a href="/test-console/" target="_blank" rel="noopener">
              开发验证
              <span class="sr-only">
                （新窗口）
              </span>
            </a>
          </div>
          <span id="session-role">
          </span>
          <button id="logout" type="button">
            退出登录
          </button>
        </div>
      </aside>
      <button id="menu-backdrop" class="menu-backdrop" type="button" hidden aria-label="关闭导航">
      </button>
      <div id="workspace" class="workspace">
        <header class="topbar">
          <div class="top-context">
            <button id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false">
              <span class="menu-icon" aria-hidden="true">
              </span>
              <span class="sr-only">
                切换导航
              </span>
            </button>

            <span id="top-title">
              工作台
            </span>
          </div>
          <div class="top-right">
            <span id="version-state" aria-live="polite">
              版本未读取
            </span>
            <button id="refresh" type="button">
              重新读取
            </button>
          </div>
        </header>
        <main id="main" tabindex="-1">
          <div id="page-head">
          </div>
          <div id="page-notice" aria-live="polite">
          </div>
          <nav id="page-tabs" class="page-tabs" aria-label="业务分区"></nav>
      <div id="page-content">
          </div>

        </main>
      </div>
    </div>
    <dialog id="entity-dialog" aria-labelledby="dialog-title">
    </dialog>
    <script type="module" src="app.js">
    </script>
  </body>
</html>
