server:
  address: 127.0.0.1
  port: ${CONTROL_PORT:8081}
spring:
  application:
    name: flowgate-control
  datasource:
    url: ${FG_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/flowgate?connectionTimeZone=UTC}
    username: ${FG_MYSQL_USERNAME:flowgate}
    password: ${FG_MYSQL_PASSWORD:}
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      connection-timeout: 2000
      validation-timeout: 1000
  data:
    redis:
      host: ${FG_REDIS_HOST:127.0.0.1}
      port: ${FG_REDIS_PORT:6379}
      password: ${FG_REDIS_PASSWORD:}
      database: ${FG_REDIS_DATABASE:0}
      timeout: 2s
      connect-timeout: 2s
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
flowgate:
  quota-activation-enabled: ${FLOWGATE_QUOTA_ACTIVATION_ENABLED:false}
  allowed-upstreams: ${FLOWGATE_ALLOWED_UPSTREAMS:http://127.0.0.1:8085}
  internal-key: ${FLOWGATE_INTERNAL_KEY}
  admin-ttl-seconds: 1800
  caller-ttl-seconds: 3600

# Kafka仅异步读模型使用；默认不连接Broker，不影响B权威准入。
flowgate.async:
  enabled: ${FLOWGATE_ASYNC_ENABLED:false}
  topic: ${FLOWGATE_USAGE_TOPIC:flowgate.usage.v1}
  poll-ms: ${FLOWGATE_ASYNC_POLL_MS:1000}
  replay-grace-seconds: ${FLOWGATE_ASYNC_REPLAY_GRACE_SECONDS:300}
spring.kafka:
  bootstrap-servers: ${FLOWGATE_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092}
  admin:
    auto-create: ${FLOWGATE_ASYNC_ENABLED:false}
    fail-fast: false
    operation-timeout: 3s
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.StringSerializer
    acks: all
    properties:
      enable.idempotence: true
      delivery.timeout.ms: 10000
      request.timeout.ms: 3000
      max.block.ms: 1000
  consumer:
    group-id: ${FLOWGATE_USAGE_GROUP:flowgate-usage-aggregate-v1}
    enable-auto-commit: false
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    max-poll-records: 20
  listener:
    ack-mode: manual_immediate
    auto-startup: ${FLOWGATE_ASYNC_ENABLED:false}
    missing-topics-fatal: false
