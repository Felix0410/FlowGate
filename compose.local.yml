# FlowGate 本地依赖，独立项目名/数据卷；不复用或覆盖其他项目的数据库。
name: flowgate-local
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: flowgate
      MYSQL_USER: ${FG_MYSQL_USERNAME:?请配置数据库用户名}
      MYSQL_PASSWORD: ${FG_MYSQL_PASSWORD:?请配置数据库密码}
      MYSQL_ROOT_PASSWORD: ${FG_MYSQL_ROOT_PASSWORD:?请配置 root 密码}
    ports:
      - "127.0.0.1:${FG_MYSQL_PORT:-13307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/flowgate-init.sql:/docker-entrypoint-initdb.d/001-flowgate.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -Nse 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${FG_REDIS_PASSWORD:?请配置 Redis 密码}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${FG_REDIS_PORT:-16380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:4.1.1
    profiles: [mq]
    restart: unless-stopped
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:${FLOWGATE_KAFKA_PORT:-19092}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://localhost:9092,EXTERNAL://127.0.0.1:${FLOWGATE_KAFKA_PORT:-19092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data

volumes:
  mysql-data:
  redis-data:
  kafka-data:
