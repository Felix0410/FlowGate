# 仅供本地开发：网关和管理端点都绑定回环地址。
server:
  address: 127.0.0.1
  port: ${GATEWAY_PORT:8080}
spring:
  application:
    name: flowgate-gateway
  cloud:
    gateway:
      server:
        webflux:
          # 已核对 5.0.4 Jar 配置元数据；关闭动态路径标签以控制基数。
          metrics:
            enabled: true
            path-tags:
              enabled: false
          # 不保留块 0 的通配静态路由：所有业务入口必须先经过可信发布。
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins: ${FLOWGATE_CONSOLE_ORIGIN:http://127.0.0.1:8081}
                allowedMethods: GET,POST,PUT,PATCH,DELETE,HEAD,OPTIONS
                allowedHeaders: Authorization,Content-Type,X-Demo-Header,X-Request-Id
                exposedHeaders: X-Request-Id
spring.data.redis:
  host: ${FG_REDIS_HOST:127.0.0.1}
  port: ${FG_REDIS_PORT:6379}
  password: ${FG_REDIS_PASSWORD:}
  database: ${FG_REDIS_DATABASE:0}
  timeout: 2s
  connect-timeout: 2s
flowgate:
  control-uri: ${FLOWGATE_CONTROL_URI:http://127.0.0.1:8081}
  internal-key: ${FLOWGATE_INTERNAL_KEY}
  node-id: ${FLOWGATE_NODE_ID:local-gateway}
  allowed-upstreams: ${FLOWGATE_ALLOWED_UPSTREAMS:http://127.0.0.1:8085}
  poll-ms: ${FLOWGATE_POLL_MS:5000}
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
      # Actuator 使用独立 HandlerMapping，需单独允许本地测试台读取状态与指标。
      cors:
        allowed-origins: ${FLOWGATE_CONSOLE_ORIGIN:http://127.0.0.1:8081}
        allowed-methods: GET
        exposed-headers: X-Request-Id
