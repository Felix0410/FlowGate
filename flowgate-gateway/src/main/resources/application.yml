# 仅供本地开发：网关和管理端点都绑定回环地址。
server:
  address: 127.0.0.1
  port: ${GATEWAY_PORT:8080}
spring:
  application:
    name: flowgate-gateway
  cloud:
    gateway:
      server:
        webflux:
          # 已核对 5.0.4 Jar 配置元数据；关闭动态路径标签以控制基数。
          metrics:
            enabled: true
            path-tags:
              enabled: false
          routes:
            - id: demo-route
              # 由部署方配置可信 Demo 地址，绝不从请求参数或 Header 取目标。
              uri: ${DEMO_UPSTREAM_URI:http://127.0.0.1:8085}
              predicates:
                - Path=/api/demo/**
              filters:
                - StripPrefix=1
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
